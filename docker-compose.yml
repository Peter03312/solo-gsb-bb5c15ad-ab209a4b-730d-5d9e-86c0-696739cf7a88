services:
  light-budget:
    build:
      context: .
      dockerfile: Dockerfile
    image: light-budget-workbench:latest
    container_name: light-budget-workbench
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # 容器内监听端口（一般无需修改；要改宿主机端口请设置 HOST_PORT）
      PORT: "8080"
      DB_PATH: "/data/light.db"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      # SQLite 数据持久化；首次启动自动建表并初始化演示数据
      - light-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  light-data:
